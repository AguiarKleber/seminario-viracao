<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Seminário da Viração</title>
  <link rel="stylesheet" href="css/base.css?v=2">
  <style>
    /* Página de entrada: duas escolhas, alvos grandes, cabe num celular em pé. */
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; font-size: clamp(18px, 2.2vw, 28px); }
    main { width: min(100%, 34em); display: flex; flex-direction: column; gap: 1.2em; }
    h1 { font-size: 1.8em; line-height: 1.1; }
    p { color: var(--texto-2); }
    .escolhas { display: flex; flex-direction: column; gap: .8em; }
    .escolhas .botao { min-height: 64px; font-size: 1.2em; text-decoration: none; justify-content: flex-start; padding: .6em 1em; }
    .escolhas .botao span { font-weight: 500; color: var(--texto-2); font-size: .8em; margin-left: auto; }
    .escolhas .botao-primario span { color: var(--texto-sobre-claro); }
  </style>
</head>
<body>
  <main>
    <h1>Seminário da Viração</h1>
    <p>Enquetes de 1 a 5 e o Jogo da Viração, em tempo real.</p>
    <nav class="escolhas" aria-label="Quem é você">
      <a id="ir-aluno" class="botao botao-primario" href="aluno/index.html">Sou aluno <span>no celular</span></a>
      <a id="ir-telao" class="botao" href="telao/index.html">Sou apresentador <span>no telão</span></a>
    </nav>
  </main>
  <script>
    // Repassa ?sala= (e ?lp=1, da rede restrita) para o celular: quem abriu o
    // link da raiz com o código não precisa digitá-lo de novo. Só um código no
    // formato da sala passa; qualquer outra coisa é descartada.
    (function () {
      'use strict';
      var busca = new URLSearchParams(location.search);
      var sala = String(busca.get('sala') || '').toUpperCase();
      if (!/^[A-HJ-NP-Z2-9]{4}$/.test(sala)) return;
      var destino = new URLSearchParams();
      destino.set('sala', sala);
      if (busca.get('lp') === '1') destino.set('lp', '1');
      document.getElementById('ir-aluno').href = 'aluno/index.html?' + destino.toString();
    })();
  </script>
</body>
</html>
